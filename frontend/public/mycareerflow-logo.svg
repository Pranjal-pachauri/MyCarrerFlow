<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="120">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Flowing M / Arrow Icon -->
  <g transform="translate(15, 15)">
    <!-- Base track -->
    <path d="M 12 75 C 12 75, 22 25, 36 25 C 48 25, 52 65, 62 65 C 72 65, 76 18, 92 18" 
          fill="none" stroke="url(#flowGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rising arrow head -->
    <path d="M 80 18 L 94 18 L 94 32" 
          fill="none" stroke="#06B6D4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Node / Milestone Dot -->
    <circle cx="36" cy="25" r="5" fill="#4F46E5" />
    <circle cx="62" cy="65" r="5" fill="#2563EB" />
  </g>

  <!-- Wordmark -->
  <text x="135" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    MyCareer<tspan fill="#2563EB">Flow</tspan>
  </text>
  <text x="136" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">
    CAREER &amp; PLACEMENT MANAGEMENT
  </text>
</svg>
